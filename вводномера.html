<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ввод номера телефона</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #0b0518 url('https://transparenttextures.com');
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .animated-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 0.8s ease-out forwards;
    }

    .h1-box {
      color: rgba(255, 255, 255, 0.9);
      font-size: 32px;
      font-weight: 500;
      margin-bottom: 32px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .form-container {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .phone {
      display: inline-flex;
      align-items: center;
      height: 72px;
      border-radius: 36px; 
      padding: 0 36px;
      background-color: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: text;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    .phone:focus-within {
      background-color: rgba(255, 255, 255, 0.07);
      border-color: #5288c1;
      box-shadow: 0 0 25px rgba(82, 136, 193, 0.3), 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    .phone select {
      border: none;
      background: transparent;
      outline: none;
      font-size: 22px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      margin-right: 18px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .phone select option {
      background-color: #0b0518; 
      color: #fff;
    }

    .phone input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 22px;
      color: #ffffff;
      padding: 0;
      width: 200px;
      letter-spacing: 0.5px;
    }

    .phone input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .submit-btn {
      height: 72px;
      border-radius: 36px;
      padding: 0 36px;
      background-color: rgba(82, 136, 193, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(82, 136, 193, 0.3);
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }

    .submit-btn:hover {
      background-color: rgba(82, 136, 193, 0.3);
      border-color: #5288c1;
      box-shadow: 0 0 25px rgba(82, 136, 193, 0.4);
    }

    .error-message {
      color: #ff4a4a;
      font-size: 18px;
      margin-top: 20px;
      font-weight: 500;
      min-height: 24px;
      opacity: 0;
      transition: opacity 0.3s ease;
      text-shadow: 0 2px 8px rgba(255, 74, 74, 0.2);
    }

    .username {
      font-size: 25px;
      text-decoration: none;
      color: rgba(78, 14, 161, 0.856);
      margin-top: 40px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="animated-content">
    <h1 class="h1-box">По возможности, введите номер</h1>

    <div class="form-container">
      <label class="phone">
        <select>
          <option value="+7">🇷🇺 +7</option>
          <option value="+375">🇧🇾 +375</option>
          <option value="+380">🇺🇦 +380</option>
          <option value="+777">an +777</option>
        </select>
        <input type="tel" id="phone-input" placeholder="(999) 000-00-00" maxlength="10">
      </label>

    <a href="username.html"><button class="submit-btn" id="submit-btn">Готово</button>
    </div>

    <a class="username" href="username.html">пропустить</a>

    <div class="error-message" id="error-box">Некорректный номер</div>
  </div>

  <script>
    const phoneInput = document.getElementById('phone-input');
    const submitBtn = document.getElementById('submit-btn');
    const errorBox = document.getElementById('error-box');

    submitBtn.addEventListener('click', () => {
      if (phoneInput.value.length === 10) {
        errorBox.style.opacity = '0';
        alert('Номер принят!');
      } else {
        errorBox.style.opacity = '1';
      }
    });

    phoneInput.addEventListener('input', () => {
      errorBox.style.opacity = '0';
    });
  </script>

</body>
</html>
