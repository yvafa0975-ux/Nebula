<!doctype html>
<html lang="ru">
<head>
    <title>Nebula welcome!</title>
    <meta charset="UTF-8">
<style>
    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #0b0813 url('https://transparenttextures.com'); 
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .screen-wrapper {
        text-align: center;
        width: 100%;
        max-width: 900px; /* Крупный контейнер для широкого экрана */
        padding: 40px;
        box-sizing: border-box;
    }

    .h1-box {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 64px; 
        font-weight: 600;
        margin-top: 0;
        margin-bottom: 60px;
        letter-spacing: 0.5px;
        color: #ffffff;
        animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
    }

    .button-a {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #ffffff;
        background-color: #1c1833;
        border: 2px solid #2d284a; 
        font-size: 40px; 
        font-weight: 500;
        border-radius: 100px;
        display: block;
        width: 100%;
        max-width: 550px; /* Ограничение ширины кнопки, чтобы овал не перетягивался */
        padding: 26px 0; /* Высокая объемная кнопка */
        text-align: center;
        margin: 0 auto; /* Центрирование кнопки по горизонтали */
        box-sizing: border-box;
        animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        opacity: 0;
        transition: all 0.2s ease;
        text-decoration: none;
    }

    .button-a:hover {
        background-color: #231d42;
        border-color: #3d3566;
        box-shadow: 0 0 30px rgba(92, 71, 189, 0.2);
    }

    .button-a:active {
        transform: scale(0.97);
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(40px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
</head>
<body>
    <div class="screen-wrapper">
        <h1 class="h1-box">Добро пожаловать в Nebula!</h1>
        <a class="button-a" href="вводномера.html">Войти</a>
    </div>
</body>
</html>
